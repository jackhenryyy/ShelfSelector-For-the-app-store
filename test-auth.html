<!DOCTYPE html>
<html>
<head>
    <title>Test Simple Spotify Auth</title>
</head>
<body>
    <h1>Simple Spotify Authentication Test</h1>
    <button onclick="testAuth()">Test Auth Route</button>
    <button onclick="testCallback()">Test Callback Route</button>
    
    <div id="results"></div>
    
    <script>
        function testAuth() {
            window.open('/api/spotify/auth', 'test', 'width=500,height=600');
        }
        
        function testCallback() {
            fetch('/api/spotify/callback?code=test_code')
                .then(r => r.text())
                .then(data => {
                    document.getElementById('results').innerHTML = '<pre>' + data + '</pre>';
                });
        }
    </script>
</body>
</html>
